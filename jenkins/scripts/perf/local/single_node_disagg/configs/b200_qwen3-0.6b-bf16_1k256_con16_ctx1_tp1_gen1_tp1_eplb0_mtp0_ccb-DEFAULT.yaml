# A small disaggregated case for the single-node driver: one context and one
# generation worker of one GPU each. Run it with
#   run_single_node_disagg.py --config-dir <this directory> \
#     disagg-e2e-b200_qwen3-0.6b-bf16_1k256_con16_ctx1_tp1_gen1_tp1_eplb0_mtp0_ccb-DEFAULT
metadata:
  model_name: qwen3_0.6b
  precision: bf16
  model_dir_name: Qwen3-0.6B
  supported_gpus:
  - B200
  script_file: disaggr_torch.slurm
  benchmark_type: 1k256
slurm:
  script_file: disaggr_torch.slurm
  partition: <partition>
  account: <account>
  job_time: 01:00:00
  job_name: unified-benchmark
  extra_args: --gres=gpu:2
  numa_bind: false
benchmark:
  mode: e2e
  use_nv_sa_benchmark: false
  multi_round: 10
  benchmark_ratio: 0.0
  streaming: true
  concurrency_list: '16'
  input_length: 1024
  output_length: 256
  dataset_file: ''
hardware:
  gpus_per_node: 2
  num_ctx_servers: 1
  num_gen_servers: 1
environment:
  container_mount: <container_mount>
  container_image: <container_image>
  model_path: <model_path>
  trtllm_repo: ''
  build_wheel: false
  work_dir: <full_path_to_work_dir>
  worker_env_var: TLLM_LOG_LEVEL=INFO TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_WORKER_DISABLE_GC=1
  server_env_var: TRTLLM_SERVER_DISABLE_GC=1 TRTLLM_DISAGG_NO_RETRY=1
profiling:
  nsys_on: false
worker_config:
  gen:
    print_iter_log: true
    max_batch_size: 16
    max_num_tokens: 2048
    max_seq_len: 1408
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    context_parallel_size: 1
    enable_attention_dp: false
    cuda_graph_config:
      enable_padding: true
      max_batch_size: 16
    kv_cache_config:
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.5
      dtype: auto
    cache_transceiver_config:
      backend: DEFAULT
    disable_overlap_scheduler: false
  ctx:
    print_iter_log: true
    max_batch_size: 16
    max_num_tokens: 8192
    max_seq_len: 1408
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    pipeline_parallel_size: 1
    context_parallel_size: 1
    enable_attention_dp: false
    cuda_graph_config: null
    kv_cache_config:
      enable_block_reuse: false
      free_gpu_memory_fraction: 0.5
      dtype: auto
    cache_transceiver_config:
      backend: DEFAULT
    disable_overlap_scheduler: true
