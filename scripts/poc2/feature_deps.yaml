#
# PoC-S2 features: who writes their end-to-end cases and which work items must
# have landed before they can be verified. pending_e2e.py reads this file.
#
# Row fields:
#   id        Unique row id; verification records name the row they verify.
#   features  Feature ids (F-xx), or the case id for a cross-cutting row.
#   cases     The cases that verify the row.
#   author    The work item that writes the cases.
#   deps      Work items that must have landed. "link" stands for the minimal
#             working chain, "trtllm-features" for every TRT-LLM feature item.
#   chain     case-02 (the TRT-LLM engine, default) or case-01 (glm). case-01
#             rows are verified only by a glm work item or by R3.
#   assignee  A fixed verifier, for rows that belong to an integration round.
#   deferred  True for rows nobody verifies in this stage.
#
# The verifier of a row is the dependency that lands last, unless the row has
# an assignee or is a case-01 row.

version: 1

