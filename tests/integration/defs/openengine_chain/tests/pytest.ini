# Self-tests of the harness. This file keeps them off tests/integration/defs/pytest.ini,
# whose plugins and conftest need a TensorRT-LLM environment.
[pytest]
pythonpath = ../..
addopts = -p no:cacheprovider -p pytester
markers =
    cpu_only: this test does not require a GPU to run
