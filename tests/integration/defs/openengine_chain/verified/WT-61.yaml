# End-to-end checks of the disaggregated chain (case-04, trtllm chain, B200) in integration round
# R12, the second feature batch: three runs of each case, all on the commit each entry names.
# Single-node cases use one node of 1 to 8 GPUs; the cases of EG-39 use two nodes of 8 GPUs each.
# Each junit path is relative to the result directory of its runs, which the work item's status
# file records. For a two-node case the path names the first node's outer junit; the chain proof
# of such a run merges both nodes' readings (runner.py --summarize-only).
# The comment above each entry tags each of its cases:
# - ok: the chain proof holds.
# - skip: an inner test was skipped, for the reason given below the tags.
# - incomplete: the case passed and the chain proof is incomplete, for the reason given below.
# Hopper (H200 and H100, sm90 image with the same Python files), run as supplementary evidence and
#   not listed: XD-042, XD-049, XD-050, XD-051 and XD-122 passed in each run with the chain proof
#   ok.
# Owed but not listed:
# - EG-28: XD-005, XD-009 and XD-010 passed in each run, and the chain proof fails in each: in
#   these gen-only runs no context worker is called (XD-005 starts none, XD-009 and XD-010 start
#   one that receives no request), while none of the three declares a single-side leg
#   expectation, so CH-3 and CH-4 fail on the context side. Left to a fix item. NT-036 (a CPU
#   test, no chain) passed in each run.
# - EG-37: NT-212 skips its test in each run: the image has no Ray, which the test needs.
