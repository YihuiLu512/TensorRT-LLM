# End-to-end checks of the disaggregated chain (case-04, trtllm chain, B200; one GPU shared by all
# workers of NT-091 and NT-200, four or eight GPUs for the XD cases). NT-091 and NT-200 ran three
# times on the commit their first entries name, and once on an earlier commit with the same tests
# (before a rebase); the XD cases ran once, on that earlier commit. Each junit path is relative to
# the result directory of its run, which the work item's status file records.
# The comment above each entry tags each of its cases:
# - ok: the chain proof holds.
# - failed: the case failed, for the reason given below the tags.
# Result and chain_proof are over all runs listed.
entries:
  # NT-091 ok: CH-2 equal on both legs (2 calls each) in every run, under the cancels_calls
  # expectation. Only the generation engine's KV-cache blocks are checked; the test's docstring
  # says why the context engine's are not.
  - row: DG-39b
    features:
    - DG-39b
    cases:
    - unittest/llmapi/apps/_test_openengine_disagg_gen_first.py::test_gen_first_cancel_closes_both_legs
    commit: cfc800e1c042fb0ea4f91f0314292d70a7c1577c
    junit:
    - b200-1g-n1-trtllm-final/b200-1g-n1-trtllm-final/job-5972814_0-r0/node0/results/e00/junit/
    - b200-1g-n1-trtllm-final/b200-1g-n1-trtllm-final/job-5972814_1-r0/node0/results/e00/junit/
    - b200-1g-n1-trtllm-final/b200-1g-n1-trtllm-final/job-5972814_2-r0/node0/results/e00/junit/
    result: passed
    chain_proof: ok
  # NT-091 ok: the run on the earlier commit
