    - accuracy/test_disaggregated_serving.py::TestQwen3_8B::test_gen_first[no_reuse]
    - accuracy/test_disaggregated_serving.py::TestQwen3_8B::test_gen_first[block_reuse]
    - accuracy/test_disaggregated_serving.py::TestDeepSeekV3Lite::test_gen_first[noadp-mtp0]
