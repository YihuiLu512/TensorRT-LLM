# the work item's status file records; runs that a node fault stopped are left out.
# An entry lists the cases whose three runs passed; the comment above it names each of them with
# "ok" (the chain proof holds), and each other case of the row with the reason it is not listed.
# A row's cases follow the parameter limits of the plan (02_functional-tests.md): EG-01a+WT-57-fix2
# takes XD-205's mtp_nextn=2 parameters, EG-03 and F-31 XD-221's block_reuse=True parameter, and
# F-31 XD-205's mtp_nextn=2 parameters; other parameters are not named in that row's comment.
