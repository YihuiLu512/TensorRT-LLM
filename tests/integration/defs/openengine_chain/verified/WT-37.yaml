# End-to-end checks of the disaggregated chain (case-04, trtllm chain, B200; 1, 4 or 8 GPUs per
# node as each test needs). junit paths are relative to the run's result directory; cpu-gate/ is
# the CPU acceptance run of the same commit.
# Why chain_proof is incomplete, by kind of case:
# - [ch6] Cases that start the disaggregated server and workers themselves: CH-1 to CH-5 hold on
#   both legs; CH-6 reads "the disaggregated server lists no worker", because the member list was
#   taken from the server's last reading, after the workers had left.
# - [restart] Cases that restart the disaggregated server: its counters start again at the
#   restart, so CH-5 counts on its side are a lower bound.
# - [cpu] CPU tests: no chain runs in them.
# - [direct] NT-041 starts two engines and hands off between them directly, with no worker front
#   end; it runs without a chain, and the chain proof does not apply.
