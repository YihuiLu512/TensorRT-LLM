# End-to-end checks of the disaggregated chain (case-04, trtllm chain, B200; 1, 4 or 8 GPUs per
# node as each test needs). Each junit path is relative to the result directory of its run, which
# the work item's status file records; cpu-gate/ is the CPU acceptance run of the entry's
# commit.
# The comment above each entry tags each of its cases:
# - ch6: CH-1 to CH-5 hold on both legs, and CH-6 reads "the disaggregated server lists no worker":
#   the member list was taken from the server's last reading, after the workers had left.
# - restart: the case restarts the disaggregated server, whose counters start again then, so CH-5
#   counts on its side are a lower bound (restart+ch6: CH-6 as above as well).
# - cpu: a CPU test, in which no chain runs.
# - direct: two engines hand off to each other with no worker front end; the case runs without a
#   chain, and the chain proof does not apply.
# - ok: the chain proof holds.
# - skip: the case was skipped, for the reason given below the tags.
# - self-routed: the test sends to the workers itself, not through the disaggregated server, so
#   CH-5 has no count of that server to compare with (+CH-n: CH-n is not met either).
# - failed: the case failed, for the reason given below the tags.
# - inner: the case runs a test file; the counts are of that file's tests, and the tests that
#   failed or are in error are named below the tags with the reason.
# Rows WT-37 owed but could not verify, and so does not list: DG-27 (its only case, NT-005, skips
# itself: it needs a two-leg request, which needs PrefillReady from the fake engine), DG-40 (XD-021
# and XD-312, both skipped on the trtllm chain by expectations/WT-54.py), DG-82+rest (XD-312),
# F-43 (XD-120 fails: the context worker's KV-cache events match none of the test's blocks; left to
# WT-53-fix2) and DG-24 (XD-026 and XD-119 fail on the chain proof alone: their tests pass, but
# CH-3 fails on the generation leg, whose engine also takes aggregated calls, which conditional
# disaggregation makes by design and no expectation allows yet; left to WT-53-fix2).
