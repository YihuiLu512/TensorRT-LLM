# End-to-end checks of the disaggregated chain (case-04, trtllm chain, B200; one GPU shared by the
# context and generation workers, two GPUs for XD-219), three runs of each case. Each junit path
# is relative to the result directory of its runs, which the work item's status file records.
# The comment above each entry tags each of its cases:
# - ok: the chain proof holds.
# - startup: the case expects the workers not to start; no chain serves a request, so the chain
#   proof reads incomplete (or no_server) and the case's own assertions are the evidence.
# - self-routed: the test sends to the workers itself (leg_expect in expectations/), and only the
#   checks that expectation names are judged.
# - killed: the test kills one role's engine.
# - direct: no worker frontend runs; the chain proof does not apply.
# Generated from the junit files; result and chain_proof are over all runs listed.
