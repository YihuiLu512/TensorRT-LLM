# test_n_best_of[*] failed in the full-module runs at 5c648719a3 (the max_num_sequences notice is
# logged once per front end, before the test started), so R3 lists it from the reruns after the fix;
# in the job-5752393 runs it was the first test to use its server and passed.
# case-02's test_gsm8k_over_chain[trtllm-tp4ep4] and [trtllm-mtp3] are listed from their reruns: in
# job 5827257 the tp4ep4 server lost its engine to a hang, and the mtp3 run that followed passed, but
# its chain proof also covered the tp4ep4 server, whose counters could not be read.
# Cases of the GLM module that are not listed, and why:
# - test_video_url[*] and accuracy/test_glm53_flash.py::TestGLM53FlashFP8::test_video_url: skipped,
#   the image's transformers has no glm5_next processor.
# - The other case's parameters skip themselves; test_gsm8k_over_chain[glm-adp_mtp3_fp8kv] (no FP8
#   KV cache on glm) and [trtllm-adp_mtp3] (covered by adp_mtp3_fp8kv) skip by design.
# GSM8K: each run is at or above the reference threshold. case-01 is paired per question with glm's
# native HTTP server in the test; case-02 with the in-process server, offline; both by an exact
# McNemar test with Holm's step-down over the three runs of a case, with no significant difference.
# Not covered here: F-36 with the NVFP4 checkpoint, F-37 (512K context) and F-31's acceptance
# length have no test yet.
# F-36 expects case-01 to refuse an FP8 KV cache; glm instead warns and runs with its default KV
# dtype (job 5827577_7, a local probe commit that is not on this branch), so that expectation is not
# recorded here.
